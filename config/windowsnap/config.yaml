# WindowSnap config — keyboard and drag-to-edge window snapping.
#
# Activation: Press the activation hotkey to enter snap mode, then press
# a snap key to move the focused window to that zone.
#
# Drag-to-edge: Drag a window to a screen edge to snap.
# Green button: Click the green button to zoom-to-fill.

# Automatically reload config when the file changes on disk.
# Changing false → true requires a restart or "Reload Config" from the menubar.
hot_reload: true

# Show the WindowSnap menubar icon.
show_menubar_icon: true

# Global activation hotkey — enters snap mode.
activation:
  modifiers: [ctrl]
  key: k

# Snap keys — pressed after activation to snap the focused window.
# No modifiers needed — just the bare key.
snap_keys:
  left: o
  top_left: g
  top: r
  top_right: l
  right: n
  bottom_right: w
  bottom: m
  bottom_left: s
  maximize: t

# Gap (in points) between snapped windows and screen edges.
edge_gap: 0

# Snap animation duration in milliseconds. 0 = instant.
animation_duration_ms: 0

# Color of the menubar icon background when snap mode is active.
# Hex RGB format.
activation_color: "#6FC3DF"

# Drag-to-edge snapping — drag a window to a screen edge to snap.
drag_to_edge:
  enabled: true               # Enable/disable drag-to-edge snapping (default: true)
  edge_width: 30              # Pixels from screen edge to trigger snap (default: 15)
  corner_width: 30            # Pixels from corner to trigger snap (default: 30)
  preview:                    # Snap preview overlay appearance
    color: "#FFFFFF"
    alpha: 0.15

# Green button override — click green button to zoom-to-fill instead of fullscreen.
green_button:
  enabled: true               # Enable/disable green button override (default: true)
