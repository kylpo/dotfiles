# MenuMeter config — system stats in your menubar.
hot_reload: true
show_menubar_icon: true
update_interval: 2.0

cpu:
  enabled: true
  style: text        # text | graph
  label: "CPU"
  color: "#FFFFFF"

ram:
  enabled: true
  style: text        # text | graph
  format: percentage # percentage | used_total
  label: "RAM"
  color: "#FFFFFF"

popover:
  background_color: "#1E1E1E"
  text_color: "#FFFFFF"
  secondary_text_color: "#8E8E93"
  accent_color: "#6FC3DF"
  font_size: 13.0
